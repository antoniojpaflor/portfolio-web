/* ============================================================================
   2. ESTADO DE NAVEGACIÓN + INDEXEDDB
   ============================================================================ */
let currentNodeId = 'root';
let navStack = ['root'];
let isTransitioning = false;
let vaultItems = [];
let dbInstance = null;

function openVaultDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('AntonioParrasVaultDB', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('media')) {
        db.createObjectStore('media', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => {
      dbInstance = e.target.result;
      resolve(dbInstance);
    };
    req.onerror = (e) => reject(e.target.error);
  });
}

async function loadVaultFromDB() {
  try {
    const db = await openVaultDB();
    return new Promise((resolve) => {
      const tx = db.transaction('media', 'readonly');
      const store = tx.objectStore('media');
      const req = store.getAll();
      req.onsuccess = () => {
        vaultItems = req.result || [];
        document.getElementById('vaultCountBadge').textContent = vaultItems.length;
        renderVaultList();
        renderBackgroundMediaWall();
        resolve();
      };
      req.onerror = () => resolve();
    });
  } catch (_) {
    renderBackgroundMediaWall();
  }
}

async function saveVaultItem(item) {
  if (!dbInstance) await openVaultDB();
  return new Promise((resolve) => {
    const tx = dbInstance.transaction('media', 'readwrite');
    tx.objectStore('media').put(item);
    tx.oncomplete = () => {
      loadVaultFromDB();
      resolve();
    };
  });
}

async function deleteVaultItem(id) {
  if (!dbInstance) await openVaultDB();
  return new Promise((resolve) => {
    const tx = dbInstance.transaction('media', 'readwrite');
    tx.objectStore('media').delete(id);
    tx.oncomplete = () => {
      loadVaultFromDB();
      resolve();
    };
  });
}

function renderBackgroundMediaWall() {
  const wall = document.getElementById('projectMediaWall');
  if (!wall) return;

  const userVisuals = vaultItems
    .filter((m) => m.type.startsWith('video/') || m.type.startsWith('image/'))
    .map((m) => ({
      src: m.dataUrl,
      kind: m.type.startsWith('video/') ? 'video' : 'image',
      label: m.name
    }));

  const pool = [...userVisuals, ...REPO_ASSETS_SEED];

  wall.innerHTML = FLOATING_SLOTS.map((slot, idx) => {
    const asset = pool[idx % pool.length];
    let mediaMarkup = '';

    if (asset && asset.kind === 'video') {
      mediaMarkup = `
        <video src="${asset.src}" autoplay loop muted playsinline
               onerror="this.parentElement.innerHTML = renderFallbackTile('${escapeHtml(slot.title)}', ${idx})"></video>
      `;
    } else if (asset && asset.kind === 'image') {
      mediaMarkup = `
        <img src="${asset.src}" alt="${escapeHtml(asset.label)}"
             onerror="this.parentElement.innerHTML = renderFallbackTile('${escapeHtml(slot.title)}', ${idx})" />
      `;
    } else {
      mediaMarkup = renderFallbackTile(slot.title, idx);
    }

    return `
      <div class="float-media-layer ${slot.anim}"
           style="left:${slot.left}; top:${slot.top}; width:${slot.w}; height:${slot.h}; z-index:${slot.z};">
        ${mediaMarkup}
      </div>
    `;
  }).join('');
}

function renderFallbackTile(title, idx) {
  return `
    <div class="float-media-art">
      <div class="text-[11px] tracking-widest text-[#39ff7a]/85">STREAM_0${idx + 1} // OVERLAP_NODE</div>
      <div class="text-2xl md:text-3xl font-extrabold tracking-wider text-[#39ff7a]">${title}</div>
      <div class="text-xs text-emerald-200/75">CRT_PHOSPHOR_FEED · DRIFT_ACTIVE</div>
    </div>
  `;
}

function toggleBgIntensity() {
  document.body.classList.toggle('bg-dim');
  const btn = document.getElementById('btnBgToggle');
  const isDim = document.body.classList.contains('bg-dim');
  btn.textContent = isDim ? 'BG_FEED: DIM' : 'BG_FEED: ON';
}

/* ============================================================================
   4. NAVEGACIÓN DISPERSA, ZOOM DE INMERSIÓN Y [ESC]
   ============================================================================ */
function renderScene(nodeId) {
  const node = PORTFOLIO_TREE[nodeId] || PORTFOLIO_TREE.root;
  currentNodeId = node.id;

  updateBreadcrumb();

  const stage = document.getElementById('scatteredStage');
  const btnAscend = document.getElementById('btnAscend');
  btnAscend.classList.toggle('hidden', navStack.length <= 1);

  const childNodes = (node.children || [])
    .map((id) => PORTFOLIO_TREE[id])
    .filter(Boolean);

  const spreadPresets = [
    { x: 22, y: 27 },
    { x: 78, y: 27 },
    { x: 24, y: 71 },
    { x: 76, y: 71 },
    { x: 50, y: 22 },
    { x: 50, y: 76 }
  ];

  let html = '';

  const centerX = 50;
  const centerY = childNodes.length > 0 ? 48 : 34;

  html += `
    <div class="scattered-node hub-node rounded-xl p-4 md:p-5 w-[min(90vw,430px)]"
         style="left:${centerX}%; top:${centerY}%;"
         onclick="handleCenterClick('${node.id}', event)">
      <div class="flex items-center justify-between text-[11px] text-emerald-300/80 mb-1">
        <span>${node.code}</span>
        <span>${childNodes.length > 0 ? childNodes.length + ' RAMAS' : 'HOJA_ACTIVA'}</span>
      </div>
      <h1 class="text-base md:text-lg font-extrabold tracking-wide text-[#39ff7a] crt-glow">${node.title}</h1>
      <p class="text-xs text-emerald-100/85 mt-1">${node.subtitle}</p>
      <p class="text-xs text-emerald-200/75 mt-2.5 leading-relaxed">${node.summary}</p>
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${(node.tags || []).map((t) => `<span class="px-2 py-0.5 text-[10px] rounded border border-emerald-400/40 bg-emerald-950/70 text-[#39ff7a]">${t}</span>`).join('')}
      </div>
    </div>
  `;

  childNodes.forEach((child, idx) => {
    const pos = child.coords || spreadPresets[idx % spreadPresets.length];
    const grandCount = (child.children || []).length;
    html += `
      <button type="button"
              class="scattered-node rounded-xl p-3.5 md:p-4 w-[min(44vw,270px)] text-left"
              style="left:${pos.x}%; top:${pos.y}%;"
              onclick="diveIntoNode('${child.id}', event)">
        <div class="flex items-center justify-between text-[10px] text-emerald-300/75 mb-1">
          <span>${child.code}</span>
          <span>${grandCount > 0 ? '▸ ' + grandCount + ' SUB' : '▸ ABRIR'}</span>
        </div>
        <div class="text-sm font-bold text-[#39ff7a] crt-glow">${child.title}</div>
        <div class="text-[11px] text-emerald-100/75 mt-1 line-clamp-2">${child.subtitle}</div>
        <div class="flex flex-wrap gap-1 mt-2">
          ${(child.tags || []).slice(0, 3).map((t) => `<span class="px-1.5 py-0.5 text-[10px] rounded bg-emerald-400/10 text-emerald-200">${t}</span>`).join('')}
        </div>
      </button>
    `;
  });

  if (childNodes.length === 0) {
    const attached = vaultItems.filter((m) => m.nodeId === node.id);
    html += `
      <div class="scattered-node rounded-xl p-4 w-[min(92vw,540px)]"
           style="left:50%; top:71%;">
        <div class="flex items-center justify-between text-[11px] text-emerald-300/80 mb-2">
          <span>MEDIA_ATTACHED // ${node.id.toUpperCase()}</span>
          <button type="button" onclick="openVaultModal('${node.id}')" class="underline text-[#39ff7a] cursor-pointer">+ AÑADIR ARCHIVO</button>
        </div>
        ${
          attached.length === 0
            ? `<p class="text-xs text-emerald-200/70">Sin archivos locales en este nodo todavía. Puedes adjuntar vídeos, imágenes o PDFs desde <span class="text-[#39ff7a]">+ MEDIA_VAULT</span>.</p>`
            : `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-32 inner-scroll">
                ${attached.map((m) => `
                  <div class="p-2 rounded border border-emerald-400/30 bg-black/50 flex items-center justify-between gap-2 text-[11px]">
                    <span class="truncate text-emerald-100">${escapeHtml(m.name)}</span>
                    <span class="text-[#39ff7a] shrink-0">${m.type.split('/')[0] || 'FILE'}</span>
                  </div>
                `).join('')}
              </div>`
        }
      </div>
    `;
  }

  stage.innerHTML = html;
}

function handleCenterClick(nodeId, event) {
  event.stopPropagation();
  const node = PORTFOLIO_TREE[nodeId];
  if (node && node.children && node.children.length > 0) {
    diveIntoNode(node.children[0], event);
  }
}

function diveIntoNode(targetId, event) {
  if (isTransitioning || !PORTFOLIO_TREE[targetId]) return;
  isTransitioning = true;

  const root = document.getElementById('viewportRoot');
  const rect = event?.currentTarget?.getBoundingClientRect();
  if (rect) {
    const cx = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
    const cy = ((rect.top + rect.height / 2) / window.innerHeight) * 100;
    root.style.setProperty('--zoom-x', `${cx.toFixed(1)}%`);
    root.style.setProperty('--zoom-y', `${cy.toFixed(1)}%`);
  }

  root.classList.add('zoom-diving');
  setTimeout(() => {
    navStack.push(targetId);
    renderScene(targetId);
    root.classList.remove('zoom-diving');
    root.classList.add('zoom-ascending');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        root.classList.remove('zoom-ascending');
        isTransitioning = false;
      });
    });
  }, 220);
}

function ascendLevel() {
  if (isTransitioning || navStack.length <= 1) return;
  isTransitioning = true;

  const root = document.getElementById('viewportRoot');
  root.style.setProperty('--zoom-x', '50%');
  root.style.setProperty('--zoom-y', '50%');
  root.classList.add('zoom-ascending');

  setTimeout(() => {
    navStack.pop();
    const prevId = navStack[navStack.length - 1] || 'root';
    renderScene(prevId);
    root.classList.remove('zoom-ascending');
    isTransitioning = false;
  }, 200);
}

function jumpToBreadcrumb(index) {
  if (index < 0 || index >= navStack.length) return;
  navStack = navStack.slice(0, index + 1);
  renderScene(navStack[navStack.length - 1]);
}

function updateBreadcrumb() {
  const bar = document.getElementById('breadcrumbBar');
  bar.innerHTML = navStack
    .map((id, idx) => {
      const n = PORTFOLIO_TREE[id];
      const label = idx === 0 ? 'ROOT' : (n ? n.title.split(' ')[0] : id.toUpperCase());
      const active = idx === navStack.length - 1;
      return `
        <button type="button" onclick="jumpToBreadcrumb(${idx})"
                class="${active ? 'text-[#39ff7a] underline' : 'text-emerald-300/75 hover:text-[#39ff7a]'} cursor-pointer">
          ${label}
        </button>
        ${idx < navStack.length - 1 ? '<span class="text-emerald-500/60">/</span>' : ''}
      `;
    })
    .join('');
}

/* ============================================================================
   5. BÓVEDA MODAL & UTILIDADES
   ============================================================================ */
function openVaultModal(preselectNodeId) {
  if (preselectNodeId) {
    const sel = document.getElementById('vaultTargetNode');
    if ([...sel.options].some((o) => o.value === preselectNodeId)) {
      sel.value = preselectNodeId;
    }
  }
  document.getElementById('vaultModal').classList.remove('hidden');
}

function closeVaultModal() {
  document.getElementById('vaultModal').classList.add('hidden');
}

function handleVaultFiles(event) {
  const files = Array.from(event.target.files || []);
  const targetNode = document.getElementById('vaultTargetNode').value;

  files.forEach((file) => {
    const reader = new FileReader();
    reader.onload = async () => {
      await saveVaultItem({
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        nodeId: targetNode,
        name: file.name,
        type: file.type || 'application/octet-stream',
        dataUrl: reader.result
      });
      renderScene(currentNodeId);
    };
    reader.readAsDataURL(file);
  });

  event.target.value = '';
}

function renderVaultList() {
  const list = document.getElementById('vaultItemsList');
  if (!list) return;

  if (vaultItems.length === 0) {
    list.innerHTML = `<div class="p-3 rounded border border-emerald-400/20 text-emerald-300/70">No hay archivos guardados en IndexedDB todavía.</div>`;
    return;
  }

  list.innerHTML = vaultItems
    .map(
      (item) => `
      <div class="p-2.5 rounded border border-emerald-400/30 bg-black/50 flex items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="font-bold text-[#39ff7a] truncate">${escapeHtml(item.name)}</div>
          <div class="text-[10px] text-emerald-300/75">RAMA: ${item.nodeId} · TIPO: ${item.type}</div>
        </div>
        <button type="button" onclick="deleteVaultItem('${item.id}')" class="px-2 py-1 rounded border border-red-400/40 text-red-300 hover:bg-red-500/15 text-[11px] shrink-0 cursor-pointer">
          BORRAR
        </button>
      </div>
    `
    )
    .join('');
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const vaultOpen = !document.getElementById('vaultModal').classList.contains('hidden');
    if (vaultOpen) {
      closeVaultModal();
    } else {
      ascendLevel();
    }
  }
});

/* ============================================================================
   6. ARRANQUE
   ============================================================================ */
renderBackgroundMediaWall();
renderScene('root');
loadVaultFromDB();
</script>
